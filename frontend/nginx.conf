server {
    listen 80;

    # Les uploads de documents passent par ce proxy : la limite par defaut
    # de nginx (1 Mo) rejetterait les fichiers jusqu'a 10 Mo acceptes par l'API.
    client_max_body_size 15m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback : toute route inconnue renvoie index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API et WebSocket proxifies vers le backend : meme origine pour le
    # navigateur, donc pas de CORS et pas d'URL backend exposee.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Headers requis pour l'upgrade WebSocket (messagerie temps reel).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evite qu'une connexion WS inactive soit coupee trop tot.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
