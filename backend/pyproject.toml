[project]
name = "backend"
version = "0.1.0"
description = "API de gestion de dossiers juridiques - FastAPI + SQLAlchemy"
readme = "README.md"
authors = [
    { name = "Abdoul-Gafar AMADOU", email = "abdoulgafaramadou938@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "pyjwt",
    "pwdlib[argon2]",
    "email-validator",
    "boto3",
    "slowapi",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.uv]
# L'app est un module plat (app/main.py) lance par uvicorn, pas un package
# installable : uv sync ne doit installer que les dependances.
package = false

# Requis par le CLI fastapi (utilise par FastAPI Cloud) pour localiser l'app
# dans notre layout plat.
[tool.fastapi]
entrypoint = "app.main:app"
